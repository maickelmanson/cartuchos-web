name: Database Backup

on:
  schedule:
    # Executa a cada 3 horas (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  
  # Permite execução manual via GitHub UI
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      
      - name: Export database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY }}
          BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL }}
        run: |
          node scripts/export-database.mjs
      
      - name: Check if database changed
        id: check_changes
        run: |
          if git diff --quiet database-backup-latest.sql; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push backup
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add database-backup-latest.sql
          git commit -m "chore: automatic database backup - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
      
      - name: Create backup archive
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          mkdir -p backups
          cp database-backup-latest.sql backups/database-backup-$(date +'%Y%m%d-%H%M%S').sql
          tar -czf backups-$(date +'%Y%m%d').tar.gz backups/
      
      - name: Upload backup as artifact
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: database-backups
          path: backups-*.tar.gz
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Database backup failed!"
          echo "Check the workflow logs for details."
